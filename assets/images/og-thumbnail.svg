<svg width="1200" height="630" viewBox="0 0 1200 630" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1c1917"/>
      <stop offset="100%" stop-color="#0c0a09"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg)"/>

  <!-- Subtle grid/pattern -->
  <circle cx="600" cy="315" r="420" fill="none" stroke="#292524" stroke-width="1.5" stroke-dasharray="6,6" opacity="0.6"/>
  <circle cx="600" cy="315" r="280" fill="none" stroke="#292524" stroke-width="1.5" opacity="0.4"/>

  <!-- Mini Compass Motif in Center-Top -->
  <g transform="translate(600, 180) scale(4.5)">
    <!-- Outer circle -->
    <circle cx="0" cy="0" r="14" fill="#292524" stroke="#c5a880" stroke-width="1.5"/>
    <circle cx="0" cy="0" r="10" fill="none" stroke="#78350f" stroke-width="0.8" stroke-dasharray="2,2"/>
    <!-- Compass needle -->
    <polygon points="4.24,-4.24 2.12,2.12 -4.24,4.24 -2.12,-2.12" fill="#c5a880" stroke="#c5a880" stroke-width="0.5"/>
    <polygon points="4.24,-4.24 2.12,2.12 0,0" fill="#d4af37"/>
    <polygon points="-4.24,4.24 -2.12,-2.12 0,0" fill="#78350f"/>
    <!-- Center pivot -->
    <circle cx="0" cy="0" r="1.5" fill="#fcfbf9"/>
  </g>

  <!-- Brand Name -->
  <text x="600" y="320" font-family="'Playfair Display', Georgia, serif" font-size="44" font-weight="700" fill="#c5a880" letter-spacing="8" text-anchor="middle">KOMPATH</text>

  <!-- Main Headline -->
  <text x="600" y="395" font-family="'Playfair Display', Georgia, serif" font-size="38" font-weight="400" fill="#fcfbf9" text-anchor="middle">Ratkaisukeskeinen terapia ja sosiaaliperhepalvelut</text>

  <!-- Subtitle -->
  <text x="600" y="455" font-family="'Inter', -apple-system, sans-serif" font-size="22" font-weight="300" fill="#a8a29e" letter-spacing="2" text-anchor="middle">Shnyar Tahir | Terapeutti &amp; Sosionomi (AMK)</text>

  <!-- Website URL badge -->
  <g transform="translate(600, 520)">
    <rect x="-120" y="-20" width="240" height="40" rx="20" fill="#292524" stroke="#44403c" stroke-width="1"/>
    <text x="0" y="7" font-family="'Inter', -apple-system, sans-serif" font-size="18" font-weight="500" fill="#c5a880" letter-spacing="1" text-anchor="middle">kompath.fi</text>
  </g>
</svg>
